services:
  postgres-dev:
    image: ${DEV_DB_IMAGE:-public.ecr.aws/supabase/postgres:17.11.0.011}
    container_name: spms_dev_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-15433}:5432"
    volumes:
      - spms_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spms_dev_pgdata:
    name: spms_dev_pgdata
