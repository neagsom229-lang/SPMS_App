name: ci

on:
  push:
    branches: [main, lean]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # 127.0.0.1 + port 15432 + a name ending in _test (the guard is exact).
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:15432/spms_test
      TEST_DB_PORT: '15432'
      CI: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
            fetch-depth: 0


      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: start test db
        env:
          TEST_DB_PORT: '15432'
        run: |
          # ECR Public anonymous pulls can hit "Data limit exceeded"; login best-effort, then retry.
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws || true
          for i in 1 2 3 4 5; do
            if docker compose -f docker-compose.test.yml pull postgres; then
              break
            fi
            echo "docker pull attempt $i failed, retrying in $((i*15))s..."
            sleep $((i*15))
          done
          docker compose -f docker-compose.test.yml up -d --wait

      - name: install root
        run: npm ci

      - name: install backend
        run: npm ci --prefix backend

      - name: install frontend
        run: npm ci --prefix frontend

      - name: secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz -C "${RUNNER_TEMP}" gitleaks
            
          "${RUNNER_TEMP}/gitleaks" detect --no-git --source . --no-banner --redact --exit-code 1 --config .gitleaks.toml

      - name: verify
        run: npm run verify
